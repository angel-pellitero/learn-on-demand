models:
  - name: fct_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
          - greater_than_five
          - average_dollars_spent_greater_than_one:
              group_by_column: customer_id